sonar.projectKey=mon-projet-databricks
sonar.projectName=Databricks Free Notebooks
sonar.sources=.
sonar.language=py

# Exclure les fichiers originaux .ipynb pour ne scanner que les conversions .py valides
sonar.exclusions=**/*.ipynb

# Ignorer les alertes de variables non définies pour l'environnement Spark (Faux positifs fréquents)
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S905
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.py
