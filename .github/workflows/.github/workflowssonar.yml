name: SonarCloud
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonar-scan:
    name: Build and analyze
    # Utilisation d'Ubuntu (plus rapide et natif pour Python/Jupytext)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Étape indispensable pour vos notebooks Databricks (.ipynb)
      - name: Install Tools & Convert Notebooks
        run: |
          pip install jupytext
          # Trouve tous les fichiers .ipynb et les convertit en .py proprement pour SonarQube
          find . -name "*.ipynb" -exec jupytext --to py {} \;

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarCloud Scan
        # Utilisation de la dernière version stable recommandée par Sonar
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=kacidatabricks-dotcom
            -Dsonar.projectKey=kacidatabricks-dotcom_GitHub_Test
            -Dsonar.sources=.
            -Dsonar.exclusions=**/*.ipynb
            -Dsonar.python.version=3.10
