name: Databricks Notebook Quality Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonar-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important pour le tracking des lignes de code par SonarQube

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Tools & Convert Notebooks
        run: |
          pip install jupytext
          # Trouve tous les fichiers .ipynb et les convertit en .py proprement pour SonarQube
          find . -name "*.ipynb" -exec jupytext --to py {} \;

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}       # À configurer dans les Secrets GitHub
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }} # Optionnel (uniquement si vous n'utilisez pas SonarCloud)
        with:
          args: >
            -Dsonar.projectKey=mon-projet-databricks
            -Dsonar.sources=.
            -Dsonar.exclusions=**/*.ipynb
            -Dsonar.python.version=3.10
